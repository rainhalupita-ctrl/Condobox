<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CondoBox SaaS Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #030712 70%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo-container {
      position: relative;
      margin-bottom: 20px;
    }
    .badge-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .badge-icon svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title span {
      background: linear-gradient(135deg, #c084fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
    }
    .status {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a855f7;
      box-shadow: 0 0 10px #a855f7;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .progress-bar-bg {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, #a855f7, #38bdf8);
      animation: load 2.5s ease-in-out infinite;
      border-radius: 999px;
    }
    @keyframes load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .version {
      position: absolute;
      bottom: 12px;
      font-size: 10px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 4.9c.55 0 1 .45 1 1v4.2c0 .55-.45 1-1 1s-1-.45-1-1V7.9c0-.55.45-1 1-1zm0 8.2c-.66 0-1.2-.54-1.2-1.2s.54-1.2 1.2-1.2 1.2.54 1.2 1.2-.54 1.2-1.2 1.2z"/>
      </svg>
    </div>
  </div>
  
  <div class="title">CondoBox <span>Master</span></div>
  <div class="subtitle">Central de Gestão SaaS do Proprietário</div>

  <div class="status">
    <div class="pulse-dot"></div>
    <span>Conectando com o Painel de Controle...</span>
  </div>

  <div class="progress-bar-bg">
    <div class="progress-bar-fill"></div>
  </div>

  <div class="version">Acesso Exclusivo • v1.0.0 Pro</div>
</body>
</html>
