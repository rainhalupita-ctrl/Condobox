<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CondoBox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at 30% 40%, #0f2820 0%, #0a1a0e 50%, #060e07 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeInUp 0.6s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-circle {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(22, 163, 74, 0.4), 0 20px 40px rgba(0,0,0,0.5);
    }

    .icon-circle svg {
      width: 52px;
      height: 52px;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-name span {
      color: #4ade80;
    }

    .tagline {
      font-size: 12px;
      color: #4b7a5e;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .loader-bar-track {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 32px;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      border-radius: 99px;
      animation: progress 1.8s ease-in-out forwards;
    }

    @keyframes progress {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 78%; }
      90%  { width: 90%; }
      100% { width: 100%; }
    }

    .loading-text {
      margin-top: 12px;
      font-size: 11px;
      color: #2d6b45;
      letter-spacing: 0.5px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    .version-tag {
      position: absolute;
      bottom: 20px;
      font-size: 10px;
      color: #1a3d27;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <div class="icon-circle">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Building -->
        <rect x="8" y="20" width="20" height="36" rx="2" fill="white" opacity="0.15"/>
        <rect x="10" y="22" width="6" height="6" rx="1" fill="white" opacity="0.8"/>
        <rect x="20" y="22" width="6" height="6" rx="1" fill="white" opacity="0.8"/>
        <rect x="10" y="32" width="6" height="6" rx="1" fill="white" opacity="0.8"/>
        <rect x="20" y="32" width="6" height="6" rx="1" fill="white" opacity="0.8"/>
        <rect x="10" y="42" width="6" height="14" rx="1" fill="white" opacity="0.8"/>
        <rect x="20" y="42" width="6" height="6" rx="1" fill="white" opacity="0.8"/>
        <!-- Roof -->
        <polygon points="18,8 36,8 36,20 8,20" fill="white" opacity="0.9"/>
        <polygon points="8,20 18,8 28,20" fill="white"/>
        <!-- Package box -->
        <rect x="32" y="34" width="26" height="22" rx="2" fill="white" opacity="0.95"/>
        <line x1="45" y1="34" x2="45" y2="56" stroke="#16a34a" stroke-width="2"/>
        <line x1="32" y1="42" x2="58" y2="42" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
        <!-- Package bow -->
        <path d="M41 34 Q45 30 49 34" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div>
      <div class="brand-name">Condo<span>Box</span></div>
      <div class="tagline">Gestão de Encomendas</div>
    </div>

    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="loading-text">Iniciando sistema...</div>
  </div>

  <div class="version-tag">v1.0.0</div>
</body>
</html>
