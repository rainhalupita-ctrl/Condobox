services:
  # ==============================================================================
  # BANCO POSTGRESQL PARA A EVOLUTION API (Armazenamento de Sessões / Tokens)
  # ==============================================================================
  evolution-postgres:
    image: postgres:15-alpine
    container_name: condo-evolution-postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password_secret
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - condo-network

  # ==============================================================================
  # REDIS PARA CACHE E FILA DE MENSAGENS ULTRA-RÁPIDA
  # ==============================================================================
  evolution-redis:
    image: redis:7-alpine
    container_name: condo-evolution-redis
    restart: always
    volumes:
      - evolution_redisdata:/data
    networks:
      - condo-network

  # ==============================================================================
  # EVOLUTION API v2 (API do WhatsApp para Notificação na Portaria)
  # ==============================================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: condo-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      
      # Autenticação da Evolution API
      - AUTHENTICATION_API_KEY=condobox_evolution_secret_key_2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # Banco de Dados
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password_secret@evolution-postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      
      # Redis Cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      
      # Webhooks (Opcional se desejar receber status de entrega das msgs)
      - WEBHOOK_GLOBAL_ENABLED=false
      
      # Integração QR Code / Baileys
      - QRCODE_LIMIT=30
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    networks:
      - condo-network

volumes:
  evolution_pgdata:
    driver: local
  evolution_redisdata:
    driver: local

networks:
  condo-network:
    driver: bridge
